# Kaizen Events - Docker Compose for Development
# Use: docker-compose -f docker-compose.dev.yml up

version: '3.8'

services:
  # MongoDB only for local development
  mongodb:
    image: mongo:6
    container_name: kaizen-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: kaizen_events
    volumes:
      - mongodb_dev_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - kaizen-dev-network

  # MongoDB Express (Web UI for MongoDB)
  mongo-express:
    image: mongo-express
    container_name: kaizen-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongodb
    networks:
      - kaizen-dev-network

volumes:
  mongodb_dev_data:

networks:
  kaizen-dev-network:
    driver: bridge
